<div class="main-layout">
  <header class="top-bar">
    <span class="app-title">PDF Translation App</span>
    <div class="top-bar-right">
      <span class="user-info">{{ facade.userEmail() }}</span>
      <button class="logout-btn" (click)="facade.logout()">Logout</button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <span class="sidebar-label">Menu</span>
      <nav>
        <a routerLink="/app/upload" routerLinkActive="active">Upload</a>
        <a routerLink="/app/translations" routerLinkActive="active">My Files</a>
      </nav>

      @if (facade.isAdmin()) {
        <span class="sidebar-label sidebar-label--admin">Admin</span>
        <nav>
          <a routerLink="/admin/settings" routerLinkActive="active">Settings</a>
          <a routerLink="/admin/languages" routerLinkActive="active">Languages</a>
        </nav>
      }
    </aside>

    <div class="main">
      <router-outlet />
    </div>
  </div>
</div>
