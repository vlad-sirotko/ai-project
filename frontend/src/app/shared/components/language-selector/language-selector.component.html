<div class="language-selector">
  @if (label()) {
    <label class="language-selector__label">{{ label() }}</label>
  }
  <select
    class="language-selector__select"
    [value]="value()"
    [disabled]="isLoading()"
    (change)="onSelectionChange($event)"
  >
    <option value="" disabled>{{ label() || 'Select language' }}</option>
    @for (lang of activeLanguages(); track lang.id) {
      <option [value]="lang.code">{{ lang.name }}</option>
    }
  </select>
</div>
